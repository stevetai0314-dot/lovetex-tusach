<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Tủ sách Lovetex</title>
<style>
:root{
  --bg:#fbf7f0; --card:#ffffff; --ink:#2b2622; --muted:#7a6f66; --line:#ece4d8;
  --y:#f2b705; --y-soft:#fff4cc; --g:#3a9d5d; --g-soft:#e2f4e8; --b:#2f6fd0; --b-soft:#e3edfb; --p:#8e5bd6; --p-soft:#efe6fb; --r:#d64545; --r-soft:#fde7e7;
  --ok:#2e8b57; --ok-soft:#e3f5ea; --out:#b5543c; --out-soft:#fbe9e4; --accent:#d9603b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.banner{background:#fff;border-bottom:1px solid var(--line);padding:8px 16px}
.banner span{display:flex;max-width:960px;margin:0 auto}
.banner img{height:22px;width:auto;display:block}
header{padding:20px 16px 18px;max-width:960px;margin:0 auto;position:relative}
header h1{padding-right:96px;font-size:24px}
.lang{position:absolute;top:14px;right:16px;min-height:44px;min-width:88px;padding:0 14px;border:1px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);font-weight:600;font-size:15px;font-family:inherit;cursor:pointer}
.guide{display:block;margin-top:8px;min-height:44px;line-height:44px;color:var(--accent);font-weight:700;text-decoration:none}
.lang:active{background:var(--y-soft)}
h1{font-size:26px;line-height:1.25;margin:0 0 6px}
.sub{color:var(--muted);margin:0}
.stats{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px}
.stat b{font-size:18px}
.how{max-width:960px;margin:0 auto 6px;padding:0 16px}
.how div{background:#fff;border:1px dashed var(--accent);border-radius:12px;padding:10px 14px;font-size:15px}
.controls{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 16px;max-width:960px;margin:0 auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.row{display:flex;gap:8px;margin-top:8px}
input[type=search]{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:15px;background:#fff}
label.toggle{display:flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap}
main{max-width:960px;margin:0 auto;padding:6px 16px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.band{height:6px}
.z-y .band{background:var(--y)} .z-g .band{background:var(--g)} .z-b .band{background:var(--b)} .z-p .band{background:var(--p)} .z-r .band{background:var(--r)}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.zone{font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;white-space:nowrap}
.z-y .zone{background:var(--y-soft);color:#7a5a00} .z-g .zone{background:var(--g-soft);color:#1f6b3b} .z-b .zone{background:var(--b-soft);color:#1d4f9a} .z-p .zone{background:var(--p-soft);color:#5b2f9e} .z-r .zone{background:var(--r-soft);color:#a12f2f}
.status{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.st-ok{background:var(--ok-soft);color:var(--ok)} .st-out{background:var(--out-soft);color:var(--out)} .st-na{background:#f1ede7;color:var(--muted)}
h2{font-size:16px;line-height:1.3;margin:2px 0 0}
.series{font-size:12.5px;color:var(--muted)}
.desc{font-size:13.5px;margin:2px 0 0}
.tip{font-size:13px;background:#faf6ef;border-radius:8px;padding:6px 10px;margin-top:auto}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.hot{color:var(--accent);font-weight:600}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:30px}
.notice{max-width:960px;margin:0 auto;padding:0 16px}
.notice div{background:var(--out-soft);color:var(--out);border-radius:10px;padding:8px 12px;font-size:14px;margin-top:8px}
.wrap{display:flex;flex-direction:column;flex:1}
.imgbox{position:relative;background:#f1ede7}
.cover{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:cover}
.imgbox .status{position:absolute;left:8px;bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.wrap .body{padding:10px 12px 12px;min-width:0}
.series-card{cursor:pointer;border-color:#d9c6f3}
.series-card:hover,.series-card:focus-visible{box-shadow:0 4px 14px rgba(142,91,214,.22);outline:none}
.rule{font-size:13px;background:var(--p-soft);color:#5b2f9e;border-radius:8px;padding:6px 10px}
.open{display:block;text-align:center;background:var(--p);color:#fff;border-radius:8px;padding:9px;font-weight:700;font-size:14px;margin-top:4px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20;align-items:flex-end;justify-content:center}
.sheet-bg.show{display:flex}
.sheet{background:#fff;width:100%;max-width:720px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px 24px}
@media(min-width:720px){.sheet-bg{align-items:center}.sheet{border-radius:18px}}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sheet h3{margin:0;font-size:19px;line-height:1.3}
.sheet .meta{justify-content:flex-start}
.x{border:0;background:#f1ede7;border-radius:999px;width:44px;height:44px;font-size:22px;cursor:pointer;flex:0 0 auto;color:var(--ink)}
.sheet .rule{margin:12px 0}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap;align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.vols{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;margin-top:8px}
.vol{border-radius:10px;display:flex;flex-direction:column;align-items:center;padding:4px 4px 6px;font-weight:800;font-size:15px;border:2px solid transparent;line-height:1.2}
.vol img{width:100%;height:auto;aspect-ratio:2/3;object-fit:cover;border-radius:6px;margin-bottom:4px;background:#f1ede7}
.vol small{font-size:10px;font-weight:600;opacity:.8}
.v-ok{background:var(--ok-soft);color:var(--ok);border-color:#bfe5cd}
.v-out{background:#f1ede7;color:#a39a91}
.v-out b{text-decoration:line-through}
.v-out img{opacity:.35;filter:grayscale(1)}
.v-na{background:#faf6ef;color:var(--muted)}
footer{max-width:960px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="banner"><span><img src="logo.svg" alt="LOVETEX" width="127" height="22"></span></div>
<header>
  <button class="lang" id="lang" type="button" aria-label="Language / 語言"></button>
  <h1 id="h1">Tủ sách cho con 📚</h1>
  <p class="sub" id="sub">Sách miễn phí cho con của anh chị em Lovetex. Không cần đặt cọc, không mất phí.</p>
  <div class="stats" id="stats"></div>
</header>
<section class="how"><div id="how"></div></section>
<div class="notice" id="notice" hidden><div></div></div>
<div class="controls">
  <div class="chips" id="zones" role="group" aria-label="Lọc theo độ tuổi"></div>
  <div class="row">
    <input type="search" id="q" placeholder="Tìm tên sách…" aria-label="Tìm tên sách">
    <label class="toggle"><input type="checkbox" id="onlyAvail"> <span id="onlyLbl">Còn sách</span></label>
  </div>
</div>
<main id="list"><p class="empty">Đang tải danh sách…</p></main>
<footer id="foot"></footer>
<div class="sheet-bg" id="sheetBg">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <div><h3 id="sheetTitle"></h3><div class="meta" id="sheetMeta"></div></div>
      <button class="x" id="sheetClose" type="button" aria-label="Đóng">×</button>
    </div>
    <div class="rule" id="sheetRule"></div>
    <div class="legend" id="sheetLegend"></div>
    <label class="toggle"><input type="checkbox" id="sheetOnly"> <span id="sheetOnlyLbl"></span></label>
    <div class="vols" id="sheetVols"></div>
  </div>
</div>

<script>
/* ===== Cấu hình / 設定 ===== */
const CONFIG = {
  // Google Sheet「書目」分頁發布的 CSV 連結
  csvUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vR6-XrRiUvj1rEjj4sxCW5LOuwSVUCCEoOy7weS_jrhOP9y9QzunjF6kiROzK1IJQNzIegpSCXOEf8E/pub?gid=390963957&single=true&output=csv",
  hotCount: 3            // 借閱次數達到幾次顯示「Được yêu thích」
};

/* ===== Giới thiệu sách / 書的簡介（依書名對應；找不到時用系列簡介） ===== */
const BOOKS = {
  "Ú òa mở ra – Phát triển nhận thức": ["Sách lật mở nhiều hình màu sắc. Bé tự lật từng trang để tìm con vật, đồ vật quen thuộc.", "Hỏi bé “Cái gì đây nhỉ?” rồi mới lật ra cùng nhau."],
  "Con thích chơi với bạn ấy lắm": ["Bé học cách làm bạn và chơi cùng các bạn khác một cách vui vẻ, tôn trọng.", "Hỏi bé: “Ở lớp con thích chơi với bạn nào?”"],
  "Tớ cũng muốn đứng tè": ["Giải thích nhẹ nhàng vì sao bạn trai và bạn gái đi vệ sinh khác nhau.", "Trả lời thật tự nhiên khi bé hỏi, không cần ngại."],
  "Nếu con là con trai": ["Bé tìm hiểu mình là bạn trai hay bạn gái, và mỗi bạn đều đặc biệt.", "Hỏi bé: “Con thích điều gì nhất ở bản thân?”"],
  "Con được sinh ra từ đâu": ["Trả lời câu hỏi bé nào cũng từng hỏi, bằng lời lẽ phù hợp với tuổi.", "Đọc chậm, để bé hỏi thêm bất cứ lúc nào."],
  "Tớ không ti mẹ nữa": ["Giúp bé chuẩn bị tâm lý khi cai sữa mẹ, nhẹ nhàng và không sợ hãi.", "Ôm bé khi đọc, khen bé đã lớn rồi."],
  "Con tắm cùng bố được không": ["Bé học về sự riêng tư của cơ thể khi lớn dần lên.", "Nói với bé: “Cơ thể là của con, con được quyền giữ riêng.”"],
  "Đừng chạm vào cháu": ["Dạy bé nói “Không!” và kể với ba mẹ khi có ai chạm vào vùng riêng tư. Cuốn rất nên đọc cùng con.", "Tập cùng bé nói to: “Đừng chạm vào cháu!”"],
  "Con muốn ngủ một mình": ["Giúp bé tự tin khi bắt đầu ngủ riêng.", "Hợp đọc trước giờ đi ngủ."],
  "Vì sao cần ăn rau": ["Rau giúp cơ thể khỏe mạnh như thế nào. Đọc xong bé dễ chịu ăn rau hơn.", "Cho bé chọn một loại rau trong bữa tối."],
  "Vì sao bị ốm": ["Vi trùng là gì, vì sao mình bị ốm và làm sao để mau khỏe.", "Cùng bé rửa tay sau khi đọc."],
  "Vì sao cần biết đọc": ["Biết đọc giúp bé tự khám phá thế giới trong sách.", "Chỉ vào chữ khi đọc để bé làm quen mặt chữ."],
  "Vì sao phải đi ngủ": ["Ngủ đủ giúp bé lớn nhanh và vui cả ngày.", "Hợp đọc ngay trước giờ ngủ."],
  "Vì sao khủng long": ["Khủng long là ai, sống ra sao và vì sao không còn nữa.", "Cùng bé giả tiếng khủng long gầm."],
  "Vì sao trời đổ mưa": ["Nước bay lên thành mây rồi rơi xuống thành mưa.", "Lần sau trời mưa, hỏi bé: “Mưa từ đâu tới nhỉ?”"],
  "Vì sao ngày và đêm": ["Vì sao có ban ngày sáng và ban đêm tối.", "Dùng đèn pin và quả bóng để làm thử cùng bé."],
  "Vì sao nên nghe lời": ["Vì sao nên lắng nghe ba mẹ, kể bằng tình huống gần gũi.", "Hỏi bé: “Nếu là con, con sẽ làm gì?”"],
  "Vì sao nước biển mặn": ["Muối trong nước biển từ đâu mà có.", "Cho bé nếm thử chút nước muối để so sánh."],
  "Vì sao ong kêu vo ve": ["Tiếng vo ve đến từ đôi cánh đập rất nhanh của ong.", "Cùng bé bắt chước tiếng “vo ve”."],
  "Khả năng thuyết phục": ["Bé học cách nói để người khác hiểu và đồng ý với mình, lịch sự và tự tin.", "Hỏi bé: “Con sẽ nói thế nào để bạn cho mượn đồ chơi?”"],
  "Storytime – Nhím con vào lớp một": ["Nhím con hồi hộp ngày đầu đi học. Hợp cho bé sắp vào lớp mới.", "Hỏi bé: “Ngày đầu đi học con thấy thế nào?”"],
  "Storytime – Chớ mắc mưu sư tử": ["Các bạn nhỏ thông minh không mắc bẫy sư tử. Bài học về cảnh giác.", "Dừng giữa truyện, hỏi bé: “Con đoán sư tử định làm gì?”"],
  "Storytime – Chiếc gối hoàn hảo của khỉ con": ["Khỉ con đi tìm chiếc gối thật vừa ý.", "Hỏi bé: “Gối của con có gì đặc biệt?”"],
  "Storytime – Bác gấu ốm rồi": ["Bạn bè cùng chăm sóc bác gấu bị ốm. Bài học về quan tâm người khác.", "Hỏi bé: “Khi ba mẹ mệt, con có thể làm gì?”"],
  "Storytime – Khủng long tập viết sách": ["Khủng long kiên trì tập viết, dù lúc đầu chưa giỏi.", "Khen bé khi bé cố gắng làm một việc khó."],
  "Storytime – Món quà dành tặng thỏ con": ["Ý nghĩa của món quà và niềm vui khi sẻ chia.", "Hỏi bé: “Con muốn tặng ai một món quà?”"],
  "Storytime – Vịt con thoát nạn": ["Vịt con bình tĩnh vượt qua nguy hiểm.", "Nói với bé phải làm gì khi bị lạc ba mẹ."],
  "Storytime – Chim cánh cụt dũng cảm": ["Chim cánh cụt nhỏ vượt qua nỗi sợ của mình.", "Hỏi bé: “Con sợ điều gì nhất?”"],
  "Storytime – Sói xám đã biết xem giờ": ["Học xem đồng hồ cùng sói xám.", "Chỉ đồng hồ trong nhà và hỏi bé “Mấy giờ rồi?”"],
  "Storytime – Điều ước của chuột chũi": ["Chuột chũi và điều ước nhỏ của mình.", "Hỏi bé: “Nếu được ước một điều, con ước gì?”"],
  "Tò Mò Muốn Biết 1 –TRÊN SA MẠC": ["Sách lật mở nhiều lớp đưa bé vào chuyến khám phá vùng sa mạc xa xôi và các loài vật sống ở đó.", "Lật nhẹ tay cùng bé, hỏi bé: “Con đoán con vật nào đang trốn ở đây?”"],
  "Tò Mò Muốn Biết 1 –TRONG GỐC CÂY": ["Bé khám phá thế giới bí mật bên trong gốc cây, nơi nhiều loài vật làm tổ.", "Hỏi bé: “Con nghĩ ai đang sống trong gốc cây này?”"],
  "Tò Mò Muốn Biết 1 –DƯỚI LÒNG ĐẤT": ["Lòng đất là ngôi nhà chung của rất nhiều loài vật. Bé lật từng trang để xem chúng sống thế nào.", "Hỏi bé: “Con vật nào sống dưới đất mà mình ít khi nhìn thấy?”"],
  "Tò Mò Muốn Biết 1 –TRONG TỔ ONG": ["Hãy tưởng tượng bé là một chú ong nhỏ, một ngày trong tổ ong sẽ ra sao? Bé lật các trang để xem.", "Cùng bé bắt chước tiếng ong “vo ve”."],
  "Tò Mò Muốn Biết 1 –TRONG RỪNG THẲM": ["Cuộc khám phá thế giới đầy bí ẩn trong khu rừng sâu, với nhiều trang lật hấp dẫn.", "Hỏi bé: “Trong rừng con thấy con vật nào?”"],
  "Tò Mò Muốn Biết 2 –TRÊN CÂY CAO": ["Một cây cổ thụ xòe tán rộng là nhà của nhiều loài vật. Bé lật ra để tìm từng bạn nhỏ.", "Cùng bé đếm xem có bao nhiêu con vật trên cây."],
  "Tò Mò Muốn Biết 2 –TRÊN THẢO NGUYÊN": ["Chuyến phiêu lưu trên thảo nguyên rộng lớn, nơi sư tử, ngựa vằn và nhiều loài khác sinh sống.", "Hỏi bé: “Con thích con vật nào trên thảo nguyên nhất?”"],
  "Tò Mò Muốn Biết 2 –TRÊN MẶT NƯỚC": ["Cuộc sống của các loài vật trên và quanh mặt nước. Bé lật từng lớp để khám phá.", "Lần sau ra ao hồ, hỏi bé: “Con nhớ con vật nào trong sách?”"],
  "Tò Mò Muốn Biết 2 –TRONG BÓNG ĐÊM": ["Bé khám phá thế giới bí ẩn khi màn đêm buông xuống và những loài vật thức giấc.", "Tắt bớt đèn, đọc nhỏ giọng cùng bé cho thật “bí ẩn”."],
  "Tò Mò Muốn Biết 2 –TRONG TỔ KIẾN": ["Hãy tưởng tượng bé là một chú kiến nhỏ, cuộc sống trong tổ kiến có gì thú vị? Bé lật ra xem.", "Hỏi bé: “Kiến làm việc cùng nhau như thế nào?”"],
  "Ehon - Những người bạn bên bờ hồ": ["Đoán xem ai đang trốn sau lưng các bạn động vật bên bờ hồ? Lật trang để tìm câu trả lời.", "Che trang lại, hỏi bé: “Con đoán ai ở phía sau?” rồi mới lật."],

  zh:{h1:"給孩子的書櫃 📚",sub:"Lovetex 員工孩子的免費書籍。不用押金，不收費。",guide:"怎麼陪孩子讀？→",howB:"想借書？",how:"到辦公室借書，下班順路來就可以。借期 2 週，可續借 1 次。",books:"本書",left:"本還在",borrowed:"次已借出",search:"搜尋書名…",only:"還有書",unknown:"未確定",avail:(a,c)=>c>1?`還有 ${a}/${c} 本`:"還有書",out:"已被借走",code:"編號：",hot:n=>`⭐ 很受歡迎 · 被借 ${n} 次`,cnt:n=>`被借 ${n} 次`,empty:"找不到符合的書。",loading:"載入書單中…",notice:"暫時無法載入借閱狀況。書單仍可瀏覽，請到辦公室詢問書是否還在。",foot:t=>`更新時間 ${t}。借閱狀況可能延遲幾分鐘。`,btn:"Tiếng Việt",zones:{all:"全部",y:"🟡 0–2 歲",g:"🟢 2–4 歲",b:"🔵 4–6 歲",p:"🟣 6 歲以上",r:"🔴 家長"},zone:{y:"0–2 歲",g:"2–4 歲",b:"4–6 歲",p:"6 歲以上",r:"家長"},serTitle:"哆啦A夢 短篇",serAvail:(a,c)=>`還有 ${a}/${c} 集`,serOpen:c=>`看 ${c} 集 →`,serRule:"📌 每次最多借 3 集，還了再借。",serOnly:"只看還在的集數",serOk:"還有書",serOut:"已被借走",vol:n=>`第 ${n} 集`,close:"關閉"}
};
let lang="vi";
if(new URLSearchParams(location.search).get("lang")==="zh") lang="zh";
const T=()=>UI[lang];

const ZONES = ["all","y","g","b","p","r"];
const state = {zone:"all", q:"", onlyAvail:false, items:[], live:false, loaded:false, time:""};

function zoneKey(z){ z=z||""; if(z.includes("家長")||z.includes("🔴"))return "r"; if(z.includes("6+")||z.includes("🟣"))return "p"; if(z.includes("0-2")||z.includes("🟡"))return "y"; if(z.includes("2-4")||z.includes("🟢"))return "g"; if(z.includes("4-6")||z.includes("🔵"))return "b"; return "b"; }
function zoneLabel(k){ return T().zone[k]; }

function parseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=""; }
    else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=""; }
    else if(c!=='\r') f+=c;
  }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  return rows;
}

function lookupBlurb(title, series){
  const B=lang==="zh"?BOOKS_ZH:BOOKS, S=lang==="zh"?SERIES_ZH:SERIES;
  if(B[title]) return B[title];
  for(const k in S){ if((series||"").startsWith(k)||(title||"").startsWith(k)) return S[k]; }
  return ["",""];
}
function seriesName(ser){
  if(lang!=="zh") return ser;
  for(const k in SERIES_NAME_ZH){ if(ser.startsWith(k)) return SERIES_NAME_ZH[k]; }
  return ser;
}

function groupRows(rows){
  // gộp các cuốn trùng tên thành một thẻ
  const map=new Map();
  for(const r of rows){
    const code=r[0], title=(r[1]||"").normalize("NFC").replace("TRONG TÔ ONG","TRONG TỔ ONG"), series=(r[2]||"").normalize("NFC"), zone=r[3], status=(r[4]||"").normalize("NFC"), count=r[5];
    if(!code||!title) continue;
    const key=title.trim();
    const out=/Đang mượn|借出/.test(status||"");
    const known=!!status;
    if(!map.has(key)) map.set(key,{title:key,series:(series||"").trim(),zone:zoneKey(zone),copies:0,avail:0,known:false,count:0,codes:[]});
    const g=map.get(key);
    g.copies++; if(known){g.known=true; if(!out) g.avail++;}
    g.count+=parseInt(count,10)||0; g.codes.push(code.trim());
  }
  return [...map.values()];
}

function fallbackItems(){
  return Object.keys(BOOKS).map(t=>({title:t,series:"",zone:t.startsWith("Ú òa")?"y":(SERIES_TITLES_G.has(t)?"g":"b"),copies:t==="Khả năng thuyết phục"?2:1,avail:0,known:false,count:0,codes:[]}));
}
const SERIES_TITLES_G=new Set(["Con thích chơi với bạn ấy lắm","Tớ cũng muốn đứng tè","Nếu con là con trai","Con được sinh ra từ đâu","Tớ không ti mẹ nữa","Con tắm cùng bố được không","Đừng chạm vào cháu","Con muốn ngủ một mình"]);

function el(tag,cls,text){ const e=document.createElement(tag); if(cls)e.className=cls; if(text!=null)e.textContent=text; return e; }

function render(){
  const list=document.getElementById("list"); list.textContent="";
  if(!state.loaded){ list.appendChild(el("p","empty",T().loading)); return; }
  const q=state.q.trim().toLowerCase();
  let items=state.items.filter(it=>(state.zone==="all"||it.zone===state.zone)&&(!q||it.title.toLowerCase().includes(q)||it.series.toLowerCase().includes(q)||(TITLES_ZH[it.title]||"").includes(q)));
  items=collapseSeries(items);
  if(state.onlyAvail&&state.live) items=items.filter(it=>it.avail>0);
  const ZO={y:0,g:1,b:2,p:3,r:4}, num=it=>{const m=/(\d+)/.exec((it.codes||[])[0]||"");return m?+m[1]:9999;};
  items.sort((a,b)=>ZO[a.zone]-ZO[b.zone]||num(a)-num(b)||a.title.localeCompare(b.title,"vi"));
  if(!items.length){ list.appendChild(el("p","empty",T().empty)); return; }
  for(const it of items){
    if(it.isSeries){ list.appendChild(seriesCard(it)); continue; }
    const [desc,tip]=lookupBlurb(it.title,it.series);
    const card=el("article","card z-"+it.zone);
    card.appendChild(el("div","band"));
    const wrap=el("div","wrap");
    const imgbox=COVERS[it.title]?el("div","imgbox"):null;
    if(imgbox){ const im=el("img","cover"); im.src=COVERS[it.title]; im.alt=it.title; im.loading="lazy"; im.width=420; im.height=420; imgbox.appendChild(im); wrap.appendChild(imgbox); }
    const body=el("div","body");
    const top=el("div","top");
    top.appendChild(el("span","zone",zoneLabel(it.zone)));
    let st;
    if(!state.live||!it.known) st=el("span","status st-na",T().unknown);
    else if(it.avail>0) st=el("span","status st-ok",T().avail(it.avail,it.copies));
    else st=el("span","status st-out",T().out);
    if(imgbox) imgbox.appendChild(st); else top.appendChild(st);
    body.appendChild(top);
    const viTitle=it.title.replace(/^Storytime – /,"");
    body.appendChild(el("h2",null,lang==="zh"&&TITLES_ZH[it.title]?TITLES_ZH[it.title]:viTitle));
    const ser=it.series&&it.series!==it.title?it.series:(it.title.startsWith("Storytime")?"Storytime":"");
    const serTxt=seriesName(ser), zhT=lang==="zh"&&TITLES_ZH[it.title];
    if(zhT||ser) body.appendChild(el("div","series",[zhT?viTitle:"",serTxt].filter(Boolean).join(" · ")));
    if(desc) body.appendChild(el("p","desc",desc));
    if(tip) body.appendChild(el("div","tip","💡 "+tip));
    const meta=el("div","meta");
    meta.appendChild(el("span",null,it.codes.length?T().code+it.codes.join(", "):""));
    if(it.count>=CONFIG.hotCount) meta.appendChild(el("span","hot",T().hot(it.count)));
    else if(it.count>0) meta.appendChild(el("span",null,T().cnt(it.count)));
    body.appendChild(meta);
    wrap.appendChild(body); card.appendChild(wrap); list.appendChild(card);
  }
}

/* ===== Bộ truyện nhiều tập (Doraemon) gộp thành 1 thẻ / 多集套書收成一張卡 ===== */
const SERIES_GROUP="Doraemon truyện ngắn";
const volNo=it=>{const m=/tập\s*(\d+)/i.exec(it.title)||/(\d+)\s*$/.exec(it.codes[0]||"");return m?+m[1]:0;};
function seriesOf(){ return state.items.filter(it=>it.series.startsWith(SERIES_GROUP)).sort((a,b)=>volNo(a)-volNo(b)); }
function collapseSeries(items){
  const vols=items.filter(it=>it.series.startsWith(SERIES_GROUP));
  if(!vols.length) return items;
  const all=seriesOf();
  const g={isSeries:true,title:SERIES_GROUP,series:SERIES_GROUP,zone:vols[0].zone,copies:all.length,
    avail:all.reduce((a,b)=>a+b.avail,0),known:all.some(v=>v.known),count:all.reduce((a,b)=>a+b.count,0),codes:[all[0].codes[0]]};
  return items.filter(it=>!it.series.startsWith(SERIES_GROUP)).concat(g);
}
function seriesCard(it){
  const t=T(), [desc,tip]=lookupBlurb(it.title,it.series), vs=seriesOf();
  const card=el("article","card series-card z-"+it.zone);
  card.tabIndex=0; card.setAttribute("role","button"); card.setAttribute("aria-label",t.serTitle+" – "+t.serOpen(it.copies));
  card.appendChild(el("div","band"));
  const wrap=el("div","wrap"), imgbox=el("div","imgbox");
  const im=el("img","cover"); im.src=COVERS[SERIES_GROUP]; im.alt=t.serTitle; im.loading="lazy"; im.width=420; im.height=420; imgbox.appendChild(im);
  imgbox.appendChild(!state.live||!it.known?el("span","status st-na",t.unknown):el("span","status "+(it.avail>0?"st-ok":"st-out"),it.avail>0?t.serAvail(it.avail,it.copies):t.out));
  wrap.appendChild(imgbox);
  const body=el("div","body"), top=el("div","top");
  top.appendChild(el("span","zone",zoneLabel(it.zone))); body.appendChild(top);
  body.appendChild(el("h2",null,t.serTitle));
  if(lang==="zh") body.appendChild(el("div","series","Doraemon – Truyện ngắn"));
  if(desc) body.appendChild(el("p","desc",desc));
  body.appendChild(el("div","rule",t.serRule));
  if(tip) body.appendChild(el("div","tip","💡 "+tip));
  const meta=el("div","meta");
  meta.appendChild(el("span",null,t.code+vs[0].codes[0]+" → "+vs[vs.length-1].codes[0]));
  if(it.count>=CONFIG.hotCount) meta.appendChild(el("span","hot",t.hot(it.count)));
  else if(it.count>0) meta.appendChild(el("span",null,t.cnt(it.count)));
  body.appendChild(meta);
  body.appendChild(el("span","open",t.serOpen(it.copies)));
  wrap.appendChild(body); card.appendChild(wrap);
  card.onclick=()=>openSheet(card);
  card.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openSheet(card);}};
  return card;
}
let sheetOpener=null;
function renderSheet(){
  const t=T(), vs=seriesOf(), only=document.getElementById("sheetOnly").checked;
  document.getElementById("sheetTitle").textContent=t.serTitle;
  const avail=vs.reduce((a,b)=>a+b.avail,0);
  document.getElementById("sheetMeta").textContent=vs.length?`${t.code}${vs[0].codes[0]} → ${vs[vs.length-1].codes[0]}`+(state.live?` · ${t.serAvail(avail,vs.length)}`:""):"";
  document.getElementById("sheetRule").textContent=t.serRule;
  document.getElementById("sheetOnlyLbl").textContent=t.serOnly;
  document.getElementById("sheetClose").setAttribute("aria-label",t.close);
  const lg=document.getElementById("sheetLegend"); lg.textContent="";
  const li=(bg,txt)=>{const s=el("span"), i=el("i"); i.style.cssText=bg; s.appendChild(i); s.appendChild(document.createTextNode(txt)); lg.appendChild(s);};
  li("background:var(--ok-soft);border:2px solid #bfe5cd",t.serOk); li("background:#f1ede7",t.serOut);
  const V=document.getElementById("sheetVols"); V.textContent="";
  for(const v of vs){
    const n=volNo(v), cls=!state.live||!v.known?"v-na":(v.avail>0?"v-ok":"v-out");
    if(only&&state.live&&cls!=="v-ok") continue;
    const d=el("div","vol "+cls); d.title=t.vol(n)+" · "+(cls==="v-ok"?t.serOk:cls==="v-out"?t.serOut:t.unknown);
    const im=el("img"); im.src="covers/doraemon/"+String(n).padStart(2,"0")+".jpg"; im.alt=""; im.loading="lazy"; im.width=180; im.height=270; d.appendChild(im);
    d.appendChild(el("b",null,String(n))); d.appendChild(el("small",null,v.codes.join(", ")));
    V.appendChild(d);
  }
}
function openSheet(from){
  sheetOpener=from||null; renderSheet();
  document.getElementById("sheetBg").classList.add("show"); document.body.style.overflow="hidden";
  document.getElementById("sheetClose").focus();
}
function closeSheet(){
  document.getElementById("sheetBg").classList.remove("show"); document.body.style.overflow="";
  if(sheetOpener) sheetOpener.focus();
}
document.getElementById("sheetClose").onclick=closeSheet;
document.getElementById("sheetBg").onclick=e=>{if(e.target.id==="sheetBg")closeSheet();};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.getElementById("sheetBg").classList.contains("show"))closeSheet();});
document.getElementById("sheetOnly").onchange=renderSheet;

function renderStats(){
  const s=document.getElementById("stats"); s.textContent="";
  const total=state.items.reduce((a,b)=>a+b.copies,0);
  const add=(n,t)=>{const d=el("div","stat"); d.appendChild(el("b",null,String(n))); d.appendChild(document.createTextNode(" "+t)); s.appendChild(d);};
  add(total,T().books);
  if(state.live){
    const avail=state.items.reduce((a,b)=>a+b.avail,0);
    add(avail,T().left);
    add(state.items.reduce((a,b)=>a+b.count,0),T().borrowed);
  }
}

function renderHow(){
  const h=document.getElementById("how"); h.textContent="";
  h.appendChild(el("b",null,T().howB));
  h.appendChild(document.createTextNode(T().how));
  const g=el("a","guide",T().guide); g.href="guide.html"+(lang==="zh"?"?lang=zh":""); h.appendChild(g);
}

function renderZones(){
  const z=document.getElementById("zones"); z.textContent="";
  for(const k of ZONES){
    const b=el("button","chip",T().zones[k]); b.type="button"; b.setAttribute("aria-pressed",String(state.zone===k));
    b.onclick=()=>{state.zone=k; renderZones(); render();};
    z.appendChild(b);
  }
}

async function load(){
  try{
    const res=await fetch(CONFIG.csvUrl+"&t="+Date.now(),{cache:"no-store"});
    if(!res.ok) throw new Error(res.status);
    const rows=parseCSV(await res.text()).slice(1);
    const items=groupRows(rows);
    if(!items.length) throw new Error("empty");
    state.items=items; state.live=true;
    state.time=new Date().toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"});
  }catch(e){
    state.items=fallbackItems(); state.live=false;
      }
  state.loaded=true; applyLang();
}

document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value; render();});
document.getElementById("onlyAvail").addEventListener("change",e=>{state.onlyAvail=e.target.checked; render();});
function applyLang(){
  const t=T();
  document.documentElement.lang=lang==="zh"?"zh-Hant":"vi";
  document.getElementById("h1").textContent=t.h1;
  document.getElementById("sub").textContent=t.sub;
  document.getElementById("onlyLbl").textContent=t.only;
  const q=document.getElementById("q"); q.placeholder=t.search; q.setAttribute("aria-label",t.search);
  document.getElementById("lang").textContent=t.btn;
  const n=document.getElementById("notice"); n.hidden=!(state.loaded&&!state.live); n.firstElementChild.textContent=t.notice;
  document.getElementById("foot").textContent=state.live?t.foot(state.time):"";
  renderHow(); renderZones(); renderStats(); render();
  if(document.getElementById("sheetBg").classList.contains("show")) renderSheet();
}
document.getElementById("lang").addEventListener("click",()=>{
  lang=lang==="vi"?"zh":"vi";
  applyLang();
});
applyLang(); load();
</script>
